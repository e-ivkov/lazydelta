schema: spec-driven

context: |
  Rust workspace (edition 2024) with three crates: lazydelta-core (changeset
  model), lazydelta-acp (blocking ACP stdio stub), lazydelta-app (GPUI 0.2
  desktop app on Linux Wayland/X11; keep macOS/Windows compiling).
  Agents are external CLIs driven via ACP, never built in-process.
  The core principle: human edits made during review are first-class hunks
  with provenance and double as agent feedback.
  Do not introduce heavy dependencies (no tokio, no git2 yet) without a
  design note; the ACP stub is intentionally blocking for now.
