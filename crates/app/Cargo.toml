[package]
name = "lazydelta-app"
description = "lazydelta: an agent-first review surface with an editable diff"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lazydelta_app"
path = "src/lib.rs"

[[bin]]
name = "lazydelta"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
lazydelta-core = { workspace = true }
lazydelta-acp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = "0.13"
